name: Issue Lifecycle Bot

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  record-merge:
    name: Mark linked issues as merged, pending release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Label and annotate the issues this PR closes
        uses: actions/github-script@v9
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            if (context.eventName !== 'pull_request') return;
            const { owner, repo } = context.repo;
            const body = process.env.PR_BODY || '';
            const numbers = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
              .map((m) => Number(m[1]));
            if (!numbers.length) return;

            const label = 'status/pending-release';
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'fbca47',
                description: 'Merged to main, pending version bump/release',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            for (const issue_number of [...new Set(numbers)]) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request) continue;
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: [
                  `Merged in ${process.env.MERGE_SHA ? '`' + process.env.MERGE_SHA.slice(0, 7) + '`' : 'a merge commit'} (PR #${process.env.PR_NUMBER}).`,
                  '',
                  `Marked \`${label}\` until the item is marked \`shipped\` in \`.github/roadmap.json\`. Closing this issue automatically triggered the **Roadmap & Issue Curator Bot** to replenish the open contributor queue.`,
                ].join('\n'),
              });
            }
