name: Roadmap & Issue Curator Bot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/roadmap.json"
      - ".github/scripts/sync_roadmap_issues.py"
      - ".github/workflows/roadmap-issue-bot.yml"
  issues:
    types: [closed]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: roadmap-issue-bot
  cancel-in-progress: false

jobs:
  curate:
    name: Sync labels and replenish contributor queue
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate manifest in dry-run mode
        run: python .github/scripts/sync_roadmap_issues.py --dry-run

      - name: Sync labels and open or close roadmap issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/sync_roadmap_issues.py
