version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "area/ci"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      npm-deps:
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      backend-pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Keep scikit-learn minor/major aligned with serialized coronary_risk_bundle.joblib until re-trained
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: ["dependencies", "area/api"]
